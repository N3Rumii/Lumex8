name: Build SecureImageViewer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt6 dependencies
      run: |
        sudo apt update
        sudo apt install -y qt6-base-dev libqt6concurrent-dev cmake g++

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Verify binary
      run: file build/SecureImageViewer
